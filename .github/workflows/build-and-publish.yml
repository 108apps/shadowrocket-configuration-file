name: Build and publish Shadowrocket files

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
      timezone: 'Europe/Moscow'
  push:
    branches:
      - main

jobs:
  build_and_publish:
    # Автоматически генерируем и публикуем правила только в основном репозитории.
    if: github.repository == 'misha-tgshv/shadowrocket-configuration-file'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Shadowrocket files
        uses: ./.github/actions/build-shadowrocket-files

      # --- Коммитим и пушим ---
      - name: Настраиваем git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Добавляем и коммитим новые файлы
        run: |
          git add rules scripts modules conf
          git commit -m "Auto: обновление сгенерированных файлы [skip ci]" || echo "No changes to commit"

      - name: Пушим изменения в main
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
