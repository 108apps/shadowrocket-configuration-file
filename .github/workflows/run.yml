name: Generate shadowrocket rules

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Создание папок ---
      - name: Создаем папки для артефактов
        run: bash -e source/build-scripts/prepare.sh

      - name: Генерируем domains_geo_detect.list
        run: bash -e source/build-scripts/domains_geo_detect.sh

      - name: Получаем только IP-адреса из доменов
        run: bash -e source/build-scripts/domain_ips.sh

      # --- Генерация файлов ---
      - name: Генерируем domains_community.list
        run: bash -e source/build-scripts/domains_community.sh

      - name: Генерируем domains_antifilter.list
        run: bash -e source/build-scripts/domains_antifilter.sh

      - name: Генерируем ips_antifilter.list
        run: bash -e source/build-scripts/ips_antifilter.sh

      - name: Генерируем domains_refilter.list
        run: bash -e source/build-scripts/domains_refilter.sh

      - name: Генерируем ips_refilter.list
        run: bash -e source/build-scripts/ips_refilter.sh

      - name: Генерируем domains_banking.list
        run: bash -e source/build-scripts/domains_banking.sh

      - name: Генерируем domains_ipchecker.list
        run: bash -e source/build-scripts/domains_ipchecker.sh


      - name: Генерируем custom-proxy.list
        run: bash -e source/build-scripts/custom-proxy.sh

      # --- Генерация скриптов ---
      - name: Генерируем rewrite.youtube.response.preview.js
        run: bash -e source/build-scripts/youtube_script.sh

      # --- Генерация модулей ---
      - name: Получаем даты последних изменений
        run: bash -e source/build-scripts/youtube_dates.sh

      - name: Генерируем YT-Premium-V1-RU.module
        run: |
          sed -e 's/\$[{][{] env.YT_SCRIPT_DATE [}][}]/${{ env.YT_SCRIPT_DATE }}/g' \
              -e 's/\$[{][{] env.YT_MODULE_DATE [}][}]/${{ env.YT_MODULE_DATE }}/g' \
              source/build-scripts/youtube_module.sh.in > "$RUNNER_TEMP/youtube_module.sh"
          bash -e "$RUNNER_TEMP/youtube_module.sh"

      - name: Генерируем Certificate.module
        run: bash -e source/build-scripts/certificate.sh
        env:
          CA_PASSPHRASE: ${{ secrets.CA_PASSPHRASE }}
          CA_P12: ${{ secrets.CA_P12 }}


      # --- Генерация конфигов ---
      - name: Создаем sr_ru_basic.conf с заменой update-url в копии general
        run: bash -e source/build-scripts/sr_ru_basic.sh

      - name: Создаем sr_ru_whitelist.conf с заменой update-url в копии general
        run: bash -e source/build-scripts/sr_ru_whitelist.sh

      - name: Создаем sr_ru_keen.conf с заменой update-url в копии general
        run: bash -e source/build-scripts/sr_ru_keen.sh

      - name: Создаем sr_nonru_basic.conf с заменой update-url
        run: bash -e source/build-scripts/sr_nonru_basic.sh

      - name: Создаем sr_ru_mini.conf с заменой update-url и проксированием портов и telegram
        run: bash -e source/build-scripts/sr_ru_mini.sh

      - name: Создаем sr_ru_extended.conf без update-url и с пустыми строками после [Rule]
        run: bash -e source/build-scripts/sr_ru_extended.sh

      - name: Создаем sr_ru_geo.conf
        run: bash -e source/build-scripts/sr_ru_geo.sh

      # --- Коммитим и пушим ---
      - name: Настраиваем git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Добавляем и коммитим новые файлы
        run: |
          git add rules scripts modules conf
          git commit -m "Auto: обновление сгенерированных файлы [skip ci]" || echo "No changes to commit"

      - name: Пушим изменения в main
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
