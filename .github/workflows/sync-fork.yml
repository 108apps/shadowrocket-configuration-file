name: Sync fork with parent repository

on:
  schedule:
    - cron: '45 3 * * *'
      timezone: 'Europe/Moscow'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Sync main with parent repository
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/merge-upstream \
            -f branch=main
